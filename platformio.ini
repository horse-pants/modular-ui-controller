; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; pioarduino fork of espressif32 — tracks current Arduino-ESP32 (v3.x / ESP-IDF v5).
; Check https://github.com/pioarduino/platform-espressif32/releases for the latest tag.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
	symlink://../ESP32WifiSetup
	lovyan03/LovyanGFX@^1.2.21
	lvgl/lvgl@^9.5.0
	bblanchon/ArduinoJson@^7.4.2
	; led_strip — Espressif's IDF 5 RMT/DMA driver. Vendored under lib/led_strip/
	; (PlatformIO auto-discovers libraries in lib/). Replaces FastLED, whose
	; RMT/SPI backends underrun their FIFOs under WiFi interrupt pressure.
lib_ignore =
	RPAsyncTCP
	ESPAsyncTCP
build_flags =
	-I include
	-fexceptions
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
board_build.filesystem = littlefs
board_build.arduino.partitions = partitions.csv
extra_scripts =
	; pre:scripts/pre_build_littlefs.py
	pre:build_web.py
